name: Build Windows and macOS Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installers
        run: npm run dist:ci

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*.exe

  build-macos:
    name: build-macos-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Confirm build architecture
        run: |
          uname -m
          test "$(node -p "process.arch")" = "${{ matrix.arch }}"

      - name: Install dependencies with optional native packages
        run: npm ci --include=optional

      - name: Verify native dependencies
        run: |
          test -d "node_modules/@img/sharp-darwin-${{ matrix.arch }}"
          test -d "node_modules/@img/sharp-libvips-darwin-${{ matrix.arch }}"

      - name: Build macOS installer
        run: npm run check && npx electron-builder --mac dmg --${{ matrix.arch }} --publish never

      - name: Verify packaged runtime
        env:
          EXPECTED_MAC_ARCH: ${{ matrix.arch }}
        run: |
          app="$(find release -name '*.app' -type d -print -quit)"
          test -n "$app"
          test -d "$app/Contents/Resources/app/node_modules/@img/sharp-darwin-${{ matrix.arch }}"
          test -d "$app/Contents/Resources/app/node_modules/@img/sharp-libvips-darwin-${{ matrix.arch }}"
          binary="$(find "$app/Contents/MacOS" -type f -print -quit)"
          ELECTRON_RUN_AS_NODE=1 "$binary" "$app/Contents/Resources/app/scripts/verify-sharp.cjs"

      - name: Upload macOS ${{ matrix.arch }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-release
          path: release/*.dmg

  publish-release:
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read package version
        id: package
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}
          name: ArkPet-XHR ${{ steps.package.outputs.version }}
          body: |
            ArkPet-XHR ${{ steps.package.outputs.version }}

            在 1.0.1 基础上叠加的功能版本，Windows 与 macOS 安装包均已提供。

            主要变更：
            - 每只桌宠拥有独立状态：精力、主动性、关系、心情、桌面陪伴时长各自成长
            - 首页总览改为显示当前桌宠自己的状态，不再共用一套数值
            - 属性归属模组：饥饿值由吃饭模组提供、对话能力由对话模组提供，未装配的模组不会在首页出现对应属性
            - 首页总览新增「模块属性」卡片，只列出当前桌宠已装配模组提供的属性
            - 「桌宠唤醒 - 角色动作」下新增角色语音：可导入 WAV 音频，并设置播放间隔与播放概率
            - 模组区域改为随内容撑高，完整包住所有模组
            - 全应用滚动条统一为角色列表同款细圆头样式
            - 状态写入改为按桌宠局部更新，避免多窗口互相覆盖
          overwrite_files: true
          files: release-files/*
