name: Build Windows and macOS Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installers
        run: npm run dist:ci

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/ArkPet-XHR Setup 1.0.0.exe
            release/ArkPet-XHR Portable 1.0.0.exe

  build-macos:
    name: build-macos-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Confirm build architecture
        run: |
          uname -m
          test "$(node -p "process.arch")" = "${{ matrix.arch }}"

      - name: Install dependencies with optional native packages
        run: npm ci --include=optional

      - name: Verify native dependencies
        run: |
          test -d "node_modules/@img/sharp-darwin-${{ matrix.arch }}"
          test -d "node_modules/@img/sharp-libvips-darwin-${{ matrix.arch }}"

      - name: Build macOS installer
        run: npm run build && npx electron-builder --mac dmg --${{ matrix.arch }} --publish never

      - name: Verify packaged runtime
        env:
          EXPECTED_MAC_ARCH: ${{ matrix.arch }}
        run: |
          app="$(find release -name '*.app' -type d -print -quit)"
          test -n "$app"
          test -d "$app/Contents/Resources/app/node_modules/@img/sharp-darwin-${{ matrix.arch }}"
          test -d "$app/Contents/Resources/app/node_modules/@img/sharp-libvips-darwin-${{ matrix.arch }}"
          binary="$(find "$app/Contents/MacOS" -type f -print -quit)"
          ELECTRON_RUN_AS_NODE=1 "$binary" "$app/Contents/Resources/app/scripts/verify-sharp.cjs"

      - name: Upload macOS ${{ matrix.arch }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-release
          path: release/ArkPet-XHR-macOS-1.0.0-${{ matrix.arch }}.dmg

  publish-release:
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: ArkPet-XHR 1.0.0
          body: ArkPet-XHR Windows and macOS builds.
          overwrite_files: true
          files: release-files/*
